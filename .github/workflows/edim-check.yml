name: EDIM check

on:
  push:
    tags:
      - "edim-deploy-*"
  workflow_call:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -U pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install --no-build-isolation -e ./model_runtime

      - name: Backend tests
        run: PYTHONPATH=backend:model_runtime python -m pytest backend/tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend check (read-only)
        run: |
          cd frontend
          npm ci
          npm run check

      - name: Zip-shape check (mirrors scripts/deploy_azure_appservice.sh)
        run: |
          python - <<'PY'
          import pathlib
          repo = pathlib.Path(".")
          api_req = repo / "backend" / "requirements-api.txt"
          assert api_req.exists(), "missing backend/requirements-api.txt"
          req_lines = [
              line.split("#", 1)[0].strip().lower()
              for line in api_req.read_text(encoding="utf-8").splitlines()
          ]
          req_lines = [line for line in req_lines if line]
          for pkg in ("calliope", "pyomo", "highspy", "xarray", "netcdf4"):
              assert not any(pkg in line for line in req_lines), (
                  f"solver package {pkg!r} must not be in requirements-api.txt"
              )
          overrides = repo / "model_runtime" / "model_modules" / "calliope" / "Calliope-Africa-main" / "overrides.yaml"
          assert overrides.exists(), "missing Calliope overrides.yaml needed by /api/scenarios"
          print("zip-shape ok")
          PY

      - name: Whitespace check
        run: git diff --check
