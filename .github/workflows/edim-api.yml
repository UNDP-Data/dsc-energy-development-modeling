name: EDIM api

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: edim-api
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy package
        run: bash scripts/stage_api_package.sh

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: undphq220api001
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: outputs/azure-deploy/edim-api.zip
